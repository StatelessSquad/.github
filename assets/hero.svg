<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="StateLess Squad: small, bright games for phones and the web">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b1e"/>
      <stop offset="0.55" stop-color="#13123a"/>
      <stop offset="1" stop-color="#071a2b"/>
    </linearGradient>
    <radialGradient id="a1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.35" stop-color="#a5b4fc"/>
      <stop offset="0.65" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#fcd34d"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="420" rx="28"/></clipPath>
    <style>
      .blob{transform-box:fill-box;transform-origin:center}
      .b1{animation:drift1 14s ease-in-out infinite}
      .b2{animation:drift2 18s ease-in-out infinite}
      .b3{animation:drift3 16s ease-in-out infinite}
      @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(160px,40px) scale(1.2)}}
      @keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-200px,-30px) scale(0.9)}}
      @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,60px)}}
      .star{animation:twinkle 3s ease-in-out infinite}
      @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
      .float{animation:float 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-14px) rotate(8deg)}}
      .spin{animation:spin 12s linear infinite;transform-box:fill-box;transform-origin:center}
      @keyframes spin{to{transform:rotate(360deg)}}
      .rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
      @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
      .t{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .caret{opacity:0;animation:blink 1s steps(1) 4.2s infinite}
      @keyframes blink{0%{opacity:1}50%{opacity:0}}
      .chip{opacity:0;animation:rise .7s ease-out forwards}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <ellipse class="blob b1" cx="220" cy="120" rx="320" ry="200" fill="url(#a1)"/>
    <ellipse class="blob b2" cx="980" cy="140" rx="340" ry="220" fill="url(#a2)"/>
    <ellipse class="blob b3" cx="700" cy="400" rx="360" ry="180" fill="url(#a3)"/>

    <g fill="#fff">
      <circle class="star" cx="80" cy="60" r="1.6"/>
      <circle class="star" cx="190" cy="340" r="1.2" style="animation-delay:.6s"/>
      <circle class="star" cx="340" cy="44" r="1.4" style="animation-delay:1.2s"/>
      <circle class="star" cx="520" cy="372" r="1.8" style="animation-delay:.3s"/>
      <circle class="star" cx="640" cy="36" r="1.2" style="animation-delay:2s"/>
      <circle class="star" cx="860" cy="380" r="1.5" style="animation-delay:1.6s"/>
      <circle class="star" cx="1010" cy="54" r="1.8" style="animation-delay:.9s"/>
      <circle class="star" cx="1130" cy="300" r="1.3" style="animation-delay:2.4s"/>
      <circle class="star" cx="1150" cy="120" r="1.1" style="animation-delay:1.1s"/>
      <circle class="star" cx="40" cy="250" r="1.4" style="animation-delay:1.8s"/>
    </g>

    <!-- floating game pieces: a merge cube, a light slab, a token, a gear -->
    <g class="float" style="animation-delay:-1s">
      <rect x="1010" y="230" width="64" height="64" rx="14" fill="#fcd34d"/>
      <text x="1042" y="273" text-anchor="middle" class="t" font-size="26" font-weight="800" fill="#7c2d12">2048</text>
    </g>
    <g class="float" style="animation-delay:-3s">
      <rect x="92" y="274" width="110" height="22" rx="6" fill="#5eead4" opacity=".9" filter="url(#glow)"/>
    </g>
    <g class="float" style="animation-delay:-2s">
      <circle cx="140" cy="140" r="22" fill="none" stroke="#f0abfc" stroke-width="5"/>
      <text x="140" y="148" text-anchor="middle" class="m" font-size="20" font-weight="700" fill="#f0abfc">AI</text>
    </g>
    <g class="spin">
      <path fill="#a5b4fc" opacity=".8" d="M1100 70l6 0 2 9 7 3 8-5 4 4-5 8 3 7 9 2 0 6-9 2-3 7 5 8-4 4-8-5-7 3-2 9-6 0-2-9-7-3-8 5-4-4 5-8-3-7-9-2 0-6 9-2 3-7-5-8 4-4 8 5 7-3z M1103 92a11 11 0 1 0 0.1 0z" fill-rule="evenodd"/>
    </g>

    <g class="rise" style="animation-delay:.1s">
      <text x="600" y="92" text-anchor="middle" class="m" font-size="18" letter-spacing="6" fill="#5eead4">// INDIE GAME STUDIO · RUN BY AGENTS</text>
    </g>
    <g class="rise" style="animation-delay:.3s">
      <text x="600" y="196" text-anchor="middle" class="t" font-size="96" font-weight="900" letter-spacing="-2" fill="url(#title)" filter="url(#glow)">StateLess Squad</text>
    </g>
    <g class="rise" style="animation-delay:.6s">
      <text x="600" y="246" text-anchor="middle" class="t" font-size="28" font-weight="600" fill="#e0e7ff">Small, bright games for phones and the web.</text>
    </g>

    <!-- typed terminal line -->
    <g transform="translate(280 282)">
      <rect width="640" height="44" rx="10" fill="#000" fill-opacity=".35" stroke="#ffffff" stroke-opacity=".12"/>
      <clipPath id="typed"><rect x="18" y="0" height="44" width="0"><animate attributeName="width" from="0" to="580" begin="1.2s" dur="3s" fill="freeze" calcMode="discrete" keyTimes="0;0.03;0.06;0.09;0.12;0.15;0.18;0.21;0.24;0.27;0.30;0.33;0.36;0.39;0.42;0.45;0.48;0.51;0.54;0.57;0.60;0.63;0.66;0.69;0.72;0.75;0.78;0.81;0.84;0.87;0.90;0.93;0.96" values="0;18;36;54;72;90;108;126;144;162;180;198;216;234;252;270;288;306;324;342;360;378;396;414;432;450;468;486;504;522;540;560;580"/></rect></clipPath>
      <text x="18" y="29" class="m" font-size="18" fill="#a5b4fc" clip-path="url(#typed)">$ squad ship --ios --android --web <tspan fill="#5eead4">✓ live</tspan></text>
      <rect class="caret" x="472" y="13" width="10" height="20" fill="#5eead4"/>
    </g>

    <g class="t" font-size="16" font-weight="700" text-anchor="middle">
      <g class="chip" style="animation-delay:1.0s"><rect x="330" y="350" width="120" height="34" rx="17" fill="#5eead4" fill-opacity=".14" stroke="#5eead4" stroke-opacity=".5"/><text x="390" y="372" fill="#99f6e4">No ads</text></g>
      <g class="chip" style="animation-delay:1.2s"><rect x="462" y="350" width="140" height="34" rx="17" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/><text x="532" y="372" fill="#ddd6fe">No accounts</text></g>
      <g class="chip" style="animation-delay:1.4s"><rect x="614" y="350" width="130" height="34" rx="17" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".5"/><text x="679" y="372" fill="#fbcfe8">No tracking</text></g>
      <g class="chip" style="animation-delay:1.6s"><rect x="756" y="350" width="120" height="34" rx="17" fill="#fcd34d" fill-opacity=".14" stroke="#fcd34d" stroke-opacity=".5"/><text x="816" y="372" fill="#fde68a">Offline</text></g>
    </g>
  </g>
</svg>
